<style>
/* Layout: one-screen phone app. The two genders are the palette (le=blue, la=red, the tricolore); the rest stays quiet. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb;
  --fg:#18202e; --muted:#5d6b80; --line:#dde3ec; --faint:#eceff4;
  --accent:#2d3a57;
  --le:#12488f; --le-bg:#e4edf8;         /* masculine — flag blue */
  --la:#cc2531; --la-bg:#fbe3e5;         /* feminine  — flag red  */
  --good:#1f8a63; --bad:#cc2531;
  --r:16px; --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a212b; --surface-2:#161d26;
  --fg:#e9edf3; --muted:#9aa7b8; --line:#28313f; --faint:#1e2631;
  --accent:#c3cde6;
  --le:#6ea6f0; --le-bg:#16233b;
  --la:#ff6e78; --la-bg:#39212a;
  --good:#5ed29f; --bad:#ff6e78;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a212b; --surface-2:#161d26;
  --fg:#e9edf3; --muted:#9aa7b8; --line:#28313f; --faint:#1e2631;
  --accent:#c3cde6;
  --le:#6ea6f0; --le-bg:#16233b;
  --la:#ff6e78; --la-bg:#39212a;
  --good:#5ed29f; --bad:#ff6e78;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}

header{display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;flex:0 0 auto}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.15rem;letter-spacing:-.01em;display:flex;gap:.3em}
.brand .b1{color:var(--le)} .brand .b2{color:var(--la)}
.stat{font-size:.72rem;color:var(--muted);text-align:right;line-height:1.3}
.stat b{color:var(--fg);font-weight:600}
.linklike{background:none;border:0;color:var(--muted);font-size:.72rem;text-decoration:underline;padding:2px 0}

#home{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.lede{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;font-weight:500;text-wrap:balance;margin:4px 0 0}
.lede small{display:block;font-family:var(--font-ui);font-size:.82rem;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:.01em}

.seg{display:flex;background:var(--faint);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-size:.86rem;font-weight:600;color:var(--muted);white-space:normal;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .arrow{font-weight:400;opacity:.6}

.section-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;transition:transform .08s ease,border-color .15s}
.deck:active{transform:scale(.98)}
.deck .nm{font-weight:600;font-size:.95rem}
.deck .ct{font-size:.74rem;color:var(--muted)}
.deck.wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between}
.deck.drill{border-color:transparent;background:linear-gradient(135deg,var(--le-bg),var(--la-bg))}
.deck.drill .nm{color:var(--fg)}
.grouphead{grid-column:1/-1;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}

#study{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding-block:6px 10px;flex:0 0 auto}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:1.1rem;flex:0 0 auto;display:grid;place-items:center}
.topmeta{flex:1 1 auto;min-width:0}
.topmeta .nm{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topmeta .sub{font-size:.72rem;color:var(--muted)}
.score{font-size:.78rem;color:var(--muted);text-align:right;flex:0 0 auto}
.score b{color:var(--good);font-weight:700}

.bar{height:5px;background:var(--faint);border-radius:99px;overflow:hidden;flex:0 0 auto}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}

.stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:10px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;flex:1 1 auto;text-align:center;box-shadow:0 2px 10px rgba(20,30,50,.05)}
.kicker{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.term{font-family:var(--font-display);font-weight:500;line-height:1.12;font-size:clamp(1.8rem,7.5vw,2.9rem);text-wrap:balance;letter-spacing:-.01em}
.term .art{font-style:italic}
.term .art.le{color:var(--le)} .term .art.la{color:var(--la)}
.answer{font-size:clamp(1.15rem,5vw,1.5rem);font-weight:600}
.example{font-size:.9rem;color:var(--muted);line-height:1.45;max-width:34ch;border-top:1px solid var(--line);padding-top:12px;font-family:var(--font-display);font-style:italic}
.verdict{font-size:.82rem;font-weight:700;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.numword{font-size:clamp(1.3rem,6.4vw,2.1rem);overflow-wrap:anywhere;max-width:100%;line-height:1.15}

.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}
.btn{border:0;border-radius:14px;padding:16px;font-size:1rem;font-weight:700;width:100%;transition:transform .07s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#11151c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1}

.arts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.art-btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 6px 14px;font-weight:700;font-size:1.2rem;line-height:1;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .07s ease,border-color .12s,background .12s}
.art-btn small{font-size:.6rem;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.art-btn:active{transform:scale(.97)}
.art-btn[data-k="le"]{color:var(--le)} .art-btn[data-k="le"].fill{background:var(--le-bg);border-color:var(--le)}
.art-btn[data-k="la"]{color:var(--la)} .art-btn[data-k="la"].fill{background:var(--la-bg);border-color:var(--la)}
.art-btn.wrong{border-color:var(--bad);background:transparent;opacity:.55}
.art-btn:disabled{cursor:default}

.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--faint);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.84rem;font-weight:600;color:var(--fg);align-self:flex-start}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"] .sw{background:var(--le)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.voicewrap{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:100%;margin-top:-8px}
.voicelabel{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.voicesel{max-width:100%;background:var(--faint);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;font-weight:600;color:var(--fg)}
.spk{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);display:inline-grid;place-items:center;transition:transform .07s ease,background .12s}
.spk:active{transform:scale(.9)} .spk.speaking{color:var(--le);border-color:var(--le)}
.cfg{width:100%;display:flex;flex-direction:column;gap:9px}
.hint{font-size:.78rem;color:var(--muted);text-align:center;max-width:32ch;margin:0 auto}

.done{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.done .big{font-family:var(--font-display);font-size:2.6rem;font-weight:500;line-height:1}
.done .pct{font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1;font-family:var(--font-ui)}
.done p{color:var(--muted);font-size:.9rem;margin:0}

.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2.5px solid var(--le);outline-offset:2px;border-radius:6px}

  if(g.startsWith("le ")) return g.slice(3);
  if(g.startsWith("la ")) return g.slice(3);

function frTerm(c){        // colour the leading article (le/la/l'/les)
  const g=c.g; let art=null, rest=g;
  if(g.startsWith("le ")){art="le";rest=g.slice(3);}
  else if(g.startsWith("la ")){art="la";rest=g.slice(3);}
  else if(g.startsWith("les ")){art="les";rest=g.slice(4);}
  else if(g.startsWith("l'")){art="l'";rest=g.slice(2);}
  if(!art) return g;
  const col = c.a==="la" ? "la" : "le";
  return `<span class="art ${col}">${art}</span>${art==="l'"?"":" "}${rest}`;

/* ---------- speech (French voice, on device) ---------- */
const canSpeak = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
let AUDIO=true, VOICE_URI=null;
try{ AUDIO = (localStorage.getItem("c1_audio")||"on")!=="off"; }catch(e){}
try{ VOICE_URI = localStorage.getItem("c1_voice")||null; }catch(e){}
function frVoices(){ return canSpeak ? speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)) : []; }
function rankVoice(v){ const n=(v.name+" "+v.voiceURI).toLowerCase(); let s=0;
  if(/google/.test(n)) s+=100;                                   // Google voices sound best
  if(/(enhanced|premium|neural|siri|natural)/.test(n)) s+=50;     // Apple enhanced / neural
  if(v.localService===false) s+=20;                              // network voices usually better
  if(/(compact|eloquence|basic)/.test(n)) s-=60;                 // the robotic ones
  if(/fr-fr/i.test(v.lang)) s+=5;
  return s; }
function chosenVoice(){ const vs=frVoices(); if(!vs.length) return null;
  if(VOICE_URI){ const m=vs.find(v=>v.voiceURI===VOICE_URI); if(m) return m; }
  return vs.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]; }
function speechText(c){ return (c.g||"").replace(/[()]/g,"").replace(/\s+/g," ").trim(); }
function speak(text){ if(!canSpeak||!text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    const v=chosenVoice(); u.lang = v ? v.lang : "fr-FR"; if(v) u.voice=v; u.rate=0.95; u.pitch=1;
    const btn=document.querySelector(".spk");
    if(btn){ u.onstart=()=>btn.classList.add("speaking"); u.onend=u.onerror=()=>btn.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  }catch(e){} }
function autoSpeak(text){ if(AUDIO) speak(text); }

/* ---------- French numbers (counting) ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
function u19(n){ return n<17 ? U[n] : "dix-"+U[n-10]; }
const T={20:"vingt",30:"trente",40:"quarante",50:"cinquante",60:"soixante"};
function fr99(n){
  if(n<20) return u19(n);
  if(n<70){ const t=Math.floor(n/10)*10,u=n%10;
    if(u===0) return T[t]; if(u===1) return T[t]+" et un"; return T[t]+"-"+U[u]; }
  if(n<80){ const r=n-60; return r===11 ? "soixante et onze" : "soixante-"+u19(r); }
  const r=n-80; return r===0 ? "quatre-vingts" : "quatre-vingt-"+u19(r);
}
function frNum(n){
  if(n===1000) return "mille";
  if(n<100) return fr99(n);
  const h=Math.floor(n/100), r=n%100;
  if(r===0) return h===1 ? "cent" : U[h]+" cents";
  return (h===1?"cent":U[h]+" cent")+" "+fr99(r);
}
function numberDeck(max,count){
  const used=new Set(), out=[];
  while(out.length<count){ const n=Math.floor(Math.random()*(max+1));
    if(used.has(n)) continue; used.add(n);
    out.push({g:frNum(n), e:String(n), a:"", c:"number", t:"", x:""}); }
  return out;
}

  const c=S.q[S.ptr]; S.card=c; S.artOk=true;
  const stage=$("#stage"), ctl=$("#controls");
  const nounMode = (S.mode==="drill") || (S.mode==="en" && isNoun(c));

  if(S.mode==="drill"){
    S.phase="article";
    stage.innerHTML=`<div class="card"><div class="kicker">le or la?</div>
       <div class="term">${bare(c)}</div>${spkBtn(bare(c))}
       <div class="example" style="border:0;padding:0;font-style:normal;color:var(--muted)">${c.e}</div></div>`;
    ctl.innerHTML=artButtons(); wireArticles(); autoSpeak(bare(c));
  } else if(S.mode==="num"){
    S.phase="reveal";
    stage.innerHTML=`<div class="card"><div class="kicker">say this number in French</div>
       <div class="term tnum" style="font-family:var(--font-ui);font-weight:800;font-size:clamp(3rem,17vw,5rem)">${c.e}</div></div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`; $("#flip").onclick=()=>revealNum(c);
  } else if(S.mode==="numr"){
    S.phase="reveal";
    stage.innerHTML=`<div class="card"><div class="kicker">which number?</div>
       <div class="term numword" style="font-family:var(--font-display)">${c.g}</div>${spkBtn(c.g)}</div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show number</button>`; $("#flip").onclick=()=>revealNumR(c); autoSpeak(c.g);
  } else if(S.mode==="en"){
    S.phase = nounMode ? "article" : "reveal";
    stage.innerHTML=`<div class="card"><div class="kicker">say it in French</div>
       <div class="term" style="font-family:var(--font-ui);font-weight:700">${c.e}</div></div>`;
    if(nounMode){ ctl.innerHTML=artButtons(); wireArticles(); }
    else { ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`; $("#flip").onclick=()=>revealEN(c,false); }
  } else {
    S.phase="reveal";
    stage.innerHTML=`<div class="card"><div class="kicker">what does it mean?</div>
       <div class="term">${frTerm(c)}</div>${spkBtn(speechText(c))}</div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`; $("#flip").onclick=()=>revealFR(c); autoSpeak(speechText(c));
  }
}
function chooseArticle(k){
  const c=S.card, ok=accepted(c).includes(k); S.artOk=ok;
  $("#controls").querySelectorAll(".art-btn").forEach(b=>{ b.disabled=true;
    if(accepted(c).includes(b.dataset.k)) b.classList.add("fill");
    if(b.dataset.k===k && !ok){ b.classList.remove("fill"); b.classList.add("wrong"); } });
  if(S.mode==="drill"){
    record(c,ok); S.answered++; if(ok)S.correct++; if(!ok)S.q.push(c);
    const card=$("#stage").querySelector(".card");
    card.insertAdjacentHTML("beforeend", `<div class="verdict ${ok?'ok':'no'}">${(ok?'✓ ':'✗ ')+c.g}</div>`);
    const sb=$("#stage").querySelector(".spk"); if(sb) sb.dataset.say=speechText(c);
    $("#controls").innerHTML=`<button class="btn primary" id="nxt">Next</button>`; $("#nxt").onclick=next;
    autoSpeak(speechText(c));
  } else { revealEN(c,true); }
}
function revealEN(c,wasNoun){
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card">
     <div class="kicker">${wasNoun?(S.artOk?'<span style="color:var(--good)">gender ✓</span>':'<span style="color:var(--bad)">gender ✗</span>'):'in French'}</div>
     <div class="term">${frTerm(c)}</div>${spkBtn(speechText(c))}
     <div class="answer" style="color:var(--muted);font-weight:500">${c.e}</div>
     ${c.x?`<div class="example">${c.x}</div>`:""}</div>`;
  markButtons(); autoSpeak(speechText(c));
}
function revealFR(c){
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card"><div class="kicker">meaning</div>
     <div class="term" style="font-size:clamp(1.4rem,6vw,2.1rem)">${frTerm(c)}</div>${spkBtn(speechText(c))}
     <div class="answer">${c.e}</div>${c.x?`<div class="example">${c.x}</div>`:""}</div>`;
  markButtons();
}
function revealNum(c){
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card"><div class="kicker tnum" style="font-size:1.4rem;font-weight:800;color:var(--accent)">${c.e}</div>
     <div class="term numword" style="font-family:var(--font-display)">${c.g}</div>${spkBtn(c.g)}</div>`;
  markButtons(); autoSpeak(c.g);
}
function revealNumR(c){
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card"><div class="kicker">${c.g}</div>
     <div class="term tnum" style="font-family:var(--font-ui);font-weight:800;font-size:clamp(3rem,17vw,5rem)">${c.e}</div>${spkBtn(c.g)}</div>`;
  markButtons();
}
function markButtons(){
  $("#controls").innerHTML=`<div class="row"><button class="btn ghost" id="again">Again</button><button class="btn primary" id="got">Got it</button></div>`;
  $("#got").onclick=()=>mark(true); $("#again").onclick=()=>mark(false);
}
function mark(gotIt){
  const c=S.card; const ok=gotIt&&S.artOk;
  if(S.mode!=="num" && S.mode!=="numr") record(c,ok);
  S.answered++; if(ok)S.correct++; if(!ok)S.q.push(c); next();
}
function next(){ S.ptr++; renderCard(); }

function finish(){
  updateTop();
  if(S.mode==="drill"){
    const pct=S.answered?Math.round(100*S.correct/S.answered):0;
    const msg = pct>=90?"Excellent !" : pct>=70?"Bien joué !" : pct>=50?"Continue comme ça !" : "C'est en forgeant qu'on devient forgeron.";
    $("#stage").innerHTML=`<div class="done"><div class="pct tnum">${pct}%</div><div class="big">${msg}</div><p>${S.correct} of ${S.answered} correct</p></div>`;
  } else {
    const msg = (S.correct===S.answered) ? "Excellent !" : "Bien joué !";
    $("#stage").innerHTML=`<div class="done"><div class="big" style="font-size:3rem">${msg}</div><p>${S.n0} card${S.n0===1?"":"s"} reviewed</p></div>`;
  }
  $("#controls").innerHTML=`<div class="row"><button class="btn ghost" id="home2">Decks</button><button class="btn primary" id="redo">Study again</button></div>`;
  $("#home2").onclick=backHome;
  $("#redo").onclick=()=> S.deck.special==="numbers"?startNumbers():start(S.deck);
}

document.addEventListener("keydown",e=>{
  if(!S) return; const k=e.key.toLowerCase();
  if(k==="escape") return backHome();
  if(S.phase==="article"){ const map={"1":"le","2":"la"}; if(map[k]) chooseArticle(map[k]); }
  else if(S.phase==="reveal" && (k===" "||k==="enter")){ e.preventDefault(); $("#flip")?.click(); }
  else if(S.phase==="mark"){ if(k==="y"||k==="enter"){e.preventDefault();mark(true);} if(k==="n")mark(false); }
  else if(S.q && $("#nxt") && (k===" "||k==="enter")){ e.preventDefault(); $("#nxt").click(); }
});

renderHome();
</script>
</body>
</html>
